<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #mensagem {
      position: fixed;
      top: 40%;
      left: 25%;
      color: #b58cff;
      font: bold 30px Arial, sans-serif;
      z-index: 10;
      cursor: grab;
      user-select: none;
      touch-action: none;
      text-shadow: 0 0 12px #ffffff;
    }
  </style>
</head>

<body>
  <a-scene embedded>
    <a-entity camera position="0 0 0"></a-entity>
  </a-scene>

  <div id="mensagem">Olá Arlindo, olá arlindo</div>

  <script>
    const texto = document.querySelector('#mensagem');
    let arrastar = false;
    let dx = 0, dy = 0;

    texto.addEventListener('pointerdown', e => {
      arrastar = true;
      dx = e.clientX - texto.offsetLeft;
      dy = e.clientY - texto.offsetTop;
      texto.setPointerCapture(e.pointerId);
      texto.style.cursor = 'grabbing';
    });

    texto.addEventListener('pointermove', e => {
      if (!arrastar) return;
      texto.style.left = (e.clientX - dx) + 'px';
      texto.style.top = (e.clientY - dy) + 'px';
    });

    texto.addEventListener('pointerup', () => {
      arrastar = false;
      texto.style.cursor = 'grab';
    });

    texto.addEventListener('pointercancel', () => {
      arrastar = false;
      texto.style.cursor = 'grab';
    });
  </script>
</body>
</html>
