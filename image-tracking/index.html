
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
<a-scene mindar-image="imageTargetSrc: ./targets-2.mind"
  color-space="sRGB" vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="alvo" mindar-image-target="targetIndex: 0">

    <!-- Casa -->
    <a-box position="0 0 0" width="0.8" height="0.6" depth="0.5"
      color="#f3d9e8"></a-box>
    <a-cone position="0 0.45 0" radius-bottom="0.65"
      radius-top="0" height="0.4" color="#d98ab5"></a-cone>
    <a-box position="0 -0.15 0.26" width="0.15" height="0.3"
      depth="0.02" color="#9b557d"></a-box>

    <!-- Plantinha -->
    <a-entity id="planta" scale="0 0 0"
      animation="property: scale; from: 0 0 0; to: 1 1 1;
      dur: 1800; easing: easeOutElastic; startEvents: crescer">

      <a-cylinder position="0 0.65 0" radius="0.018"
        height="0.6" color="#43875a"></a-cylinder>

      <a-sphere position="-0.12 0.75 0" scale="1.5 0.45 0.5"
        rotation="0 0 30" color="#65b879"></a-sphere>
      <a-sphere position="0.12 0.9 0" scale="1.5 0.45 0.5"
        rotation="0 0 -30" color="#398b55"></a-sphere>
    </a-entity>

  </a-entity>
</a-scene>

<script>
const alvo = document.querySelector('#alvo');
const planta = document.querySelector('#planta');

alvo.addEventListener('targetFound', () => {
  planta.setAttribute('scale', '0 0 0');
  planta.emit('crescer');
});

alvo.addEventListener('targetLost', () => {
  planta.setAttribute('scale', '0 0 0');
});
</script>
</body>
</html>
