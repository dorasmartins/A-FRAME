
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
<a-scene mindar-image="imageTargetSrc: ./targets-2.mind"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="alvo" mindar-image-target="targetIndex: 0">
    <a-box position="0 0 0" width="0.8" height="0.6"
      depth="0.5" color="#f3d9e8"></a-box>
    <a-cone position="0 0.45 0" radius-bottom="0.65"
      radius-top="0" height="0.35" color="#d98ab5"></a-cone>

    <a-cylinder id="caule" position="0 0.3 0"
      radius="0.018" height="0.01" color="#43875a"></a-cylinder>

    <a-sphere id="folha1" position="0 0.55 0"
      scale="0 0 0" color="#65b879"
      animation="property: scale; to: 0.16 0.07 0.05;
      dur: 1800; delay: 1400; easing: easeInOutSine"></a-sphere>

    <a-sphere id="folha2" position="0 0.72 0"
      scale="0 0 0" color="#398b55"
      animation="property: scale; to: 0.07 0.16 0.05;
      dur: 1800; delay: 3200; easing: easeInOutSine"></a-sphere>
  </a-entity>
</a-scene>

<script>
const alvo = document.querySelector('#alvo');
const caule = document.querySelector('#caule');
const folhas = [
  document.querySelector('#folha1'),
  document.querySelector('#folha2')
];

alvo.addEventListener('targetFound', () => {
  caule.setAttribute('animation', {
    property: 'height', from: 0.01, to: 0.65,
    dur: 3500, easing: 'easeInOutSine'
  });
  folhas.forEach(f => {
    f.setAttribute('scale', '0 0 0');
    f.setAttribute('animation__grow', {
      property: 'scale',
      to: f.id === 'folha1' ? '0.16 0.07 0.05' : '0.07 0.16 0.05',
      dur: 1800,
      delay: f.id === 'folha1' ? 3500 : 5300,
      easing: 'easeInOutSine'
    });
  });
});

alvo.addEventListener('targetLost', () => {
  caule.setAttribute('height', 0.01);
  folhas.forEach(f => f.setAttribute('scale', '0 0 0'));
});
</script>
</body>
</html>
