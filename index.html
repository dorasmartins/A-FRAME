<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <title>A-FRAME — A minha primeira cena</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>

    <a-scene>

        <a-box
            position="-1.5 0.8 -4"
            rotation="0 30 0"
            color="#B57EDC">

            radius="1.25"
            color="#D8B4FE">

            height="1.5"
            color="#9B5DE5">
        </a-cylinder>

        <a-plane
            position="0 0 -4"
            rotation="-90 0 0"
            width="5"
            height="5"
            color="#C8A2C8">
        </a-plane>

        <a-text
            value="Dora Martins"
            position="-1.5 3.2 -4"
            color="#FFFFFF"
            width="6">
